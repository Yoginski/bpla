                                <div>
                                    <div class="text-sm font-bold text-white">🎓 Полный Мега-Экзамен (Все вопросы)</div>
                                    <div class="text-[11px] text-slate-400">Абсолютная проверка всех разделов и законов КР</div>
                                </div>
                            </div>
                        </label>
                    </div>

                    <button onclick="startExam()" class="w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold rounded-2xl shadow-xl shadow-blue-600/30 transition-all active:scale-95 text-base cursor-pointer">
                        Начать тестирование →
                    </button>
                </div>
            `;
        }

        function startExam() {
            const selectedMode = document.querySelector('input[name="exam-mode"]:checked').value;
            state.currentMode = selectedMode;
            state.score = 0;
            state.currentIndex = 0;
            state.userAnswers = [];

            let rawQuestions = [];

            if (selectedMode === 'random15') {
                rawQuestions = shuffleArray(MASTER_QUESTION_BANK).slice(0, 15);
            } else if (selectedMode === 'random25') {
                rawQuestions = shuffleArray(MASTER_QUESTION_BANK).slice(0, 25);
            } else if (selectedMode === 'law') {
                rawQuestions = MASTER_QUESTION_BANK.filter(q => q.category === 'Право КР');
            } else if (selectedMode === 'apkr') {
                rawQuestions = MASTER_QUESTION_BANK.filter(q => q.category === 'АПКР-6 Ч.4');
            } else if (selectedMode === 'zones') {
                rawQuestions = MASTER_QUESTION_BANK.filter(q => q.category === 'Зоны ИВП');
            } else if (selectedMode === 'reg') {
                rawQuestions = MASTER_QUESTION_BANK.filter(q => q.category === 'Регламент');
            } else if (selectedMode === 'failsafe') {
                rawQuestions = MASTER_QUESTION_BANK.filter(q => q.category === 'Безопасность' || q.category === 'Failsafe');
            } else if (selectedMode === 'physics') {
                rawQuestions = MASTER_QUESTION_BANK.filter(q => q.category === 'Физика полёта');
            } else if (selectedMode === 'full') {
                rawQuestions = shuffleArray(MASTER_QUESTION_BANK);
            }

            // Shuffle options for each question
            state.questionsList = rawQuestions.map(q => {
                const optionsObj = q.options.map((optText, idx) => ({
                    text: optText,
                    isCorrect: idx === q.correct
                }));
                const shuffledOpts = shuffleArray(optionsObj);
                return {
                    category: q.category,
                    question: q.question,
                    options: shuffledOpts,
                    explanation: q.explanation
                };
            });

            renderQuestion();
        }

        function renderQuestion() {
            const q = state.questionsList[state.currentIndex];
            state.selectedOption = null;
            state.isAnswered = false;

            const progress = ((state.currentIndex) / state.questionsList.length) * 100;

            quizContainer.innerHTML = `
                <!-- Progress Header Bar -->
                <div class="w-full bg-slate-950/80 h-2">
                    <div class="bg-gradient-to-r from-blue-500 via-indigo-500 to-cyan-400 h-full transition-all duration-300" style="width: ${progress}%"></div>
                </div>

                <div class="p-6 sm:p-8 fade-in">
                    <!-- Meta info -->
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-blue-400 uppercase tracking-widest">
                            Вопрос ${state.currentIndex + 1} из ${state.questionsList.length}
                        </span>
                        <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                            ${q.category}
                        </span>
                    </div>

                    <!-- Question Title -->
                    <h3 class="text-base sm:text-lg font-extrabold text-white mb-6 leading-snug">
                        ${q.question}
                    </h3>

                    <!-- Options Grid -->
                    <div class="space-y-3 mb-6" id="options-list">
                        ${q.options.map((opt, idx) => `
                            <button onclick="selectOption(${idx})" data-idx="${idx}" class="opt-btn w-full text-left p-4 rounded-2xl border border-slate-800 bg-slate-800/40 hover:bg-slate-800 hover:border-slate-700 transition-all flex items-start space-x-3 group cursor-pointer">
                                <span class="opt-letter w-7 h-7 rounded-xl bg-slate-800 group-hover:bg-blue-600/30 text-slate-300 group-hover:text-blue-400 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 transition-colors">
                                    ${String.fromCharCode(65 + idx)}
                                </span>
                                <span class="text-sm sm:text-base text-slate-200 leading-relaxed font-medium">
                                    ${opt.text}
                                </span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Explanation Box -->
                    <div id="explanation-box" class="hidden mb-6 p-4 rounded-2xl border text-sm leading-relaxed fade-in"></div>

                    <!-- Action Button -->
                    <button id="action-btn" disabled onclick="handleAction()" class="w-full py-4 bg-slate-800 text-slate-500 font-bold rounded-2xl cursor-not-allowed transition-all text-base">
                        Подтвердить выбор
                    </button>
                </div>
            `;
        }

        function selectOption(index) {
            if (state.isAnswered) return;

            state.selectedOption = index;

            document.querySelectorAll('.opt-btn').forEach((btn, idx) => {
                if (idx === index) {
                    btn.className = "opt-btn w-full text-left p-4 rounded-2xl border-2 border-blue-500 bg-blue-500/10 flex items-start space-x-3 transition-all cursor-pointer";
                    btn.querySelector('.opt-letter').className = "opt-letter w-7 h-7 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-0.5";
                } else {
                    btn.className = "opt-btn w-full text-left p-4 rounded-2xl border border-slate-800 bg-slate-800/40 opacity-60 flex items-start space-x-3 transition-all cursor-pointer";
                    btn.querySelector('.opt-letter').className = "opt-letter w-7 h-7 rounded-xl bg-slate-800 text-slate-400 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5";
                }
            });

            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = false;
            actionBtn.className = "w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-blue-600/30 transition-all active:scale-95 text-base cursor-pointer";
        }

        function handleAction() {
            if (!state.isAnswered) {
                checkAnswer();
            } else {
                state.currentIndex++;
                if (state.currentIndex < state.questionsList.length) {
                    renderQuestion();
                } else {
                    renderResults();
                }
            }
        }

        function checkAnswer() {
            state.isAnswered = true;
            const q = state.questionsList[state.currentIndex];
            const selectedOptObj = q.options[state.selectedOption];
            const isCorrect = selectedOptObj.isCorrect;

            if (isCorrect) state.score++;

            state.userAnswers.push({
                question: q.question,
                isCorrect: isCorrect,
                explanation: q.explanation
            });

            const options = document.querySelectorAll('.opt-btn');
            options.forEach((btn, idx) => {
                btn.onclick = null;
                const optObj = q.options[idx];
                if (optObj.isCorrect) {
                    btn.className = "opt-btn w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-500/10 flex items-start space-x-3";
                    btn.querySelector('.opt-letter').className = "opt-letter w-7 h-7 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-0.5";
                } else if (idx === state.selectedOption && !isCorrect) {
                    btn.className = "opt-btn w-full text-left p-4 rounded-2xl border-2 border-rose-500 bg-rose-500/10 flex items-start space-x-3";
                    btn.querySelector('.opt-letter').className = "opt-letter w-7 h-7 rounded-xl bg-rose-500 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-0.5";
                } else {
                    btn.className = "opt-btn w-full text-left p-4 rounded-2xl border border-slate-900 bg-slate-950/40 opacity-40 flex items-start space-x-3";
                }
            });

            const expBox = document.getElementById('explanation-box');
            expBox.classList.remove('hidden');

            if (isCorrect) {
                expBox.className = "mb-6 p-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-200 text-sm leading-relaxed fade-in";
                expBox.innerHTML = `<strong class="text-emerald-400 block mb-1">✓ Верный ответ!</strong> ${q.explanation}`;
            } else {
                expBox.className = "mb-6 p-4 rounded-2xl border border-rose-500/30 bg-rose-500/10 text-rose-200 text-sm leading-relaxed fade-in";
                expBox.innerHTML = `<strong class="text-rose-400 block mb-1">✕ Ошибка</strong> ${q.explanation}`;
            }

            const actionBtn = document.getElementById('action-btn');
            actionBtn.textContent = state.currentIndex === state.questionsList.length - 1 ? "Посмотреть результаты" : "Следующий вопрос →";
        }

        function renderResults() {
            const total = state.questionsList.length;
            const percentage = Math.round((state.score / total) * 100);
            let badgeText = "";
            let badgeColor = "";

            if (percentage >= 85) {
                badgeText = "Отличный результат! Высокий уровень знаний законодательства и безопасности КР.";
                badgeColor = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
            } else if (percentage >= 65) {
                badgeText = "Зачет получен, но рекомендуется повторить разделы безопасности и законов.";
                badgeColor = "bg-amber-500/20 text-amber-400 border-amber-500/30";
            } else {
                badgeText = "Экзамен не сдан. Повторите АПКР-6 Ч.IV и Воздушный кодекс КР.";
                badgeColor = "bg-rose-500/20 text-rose-400 border-rose-500/30";
            }

            quizContainer.innerHTML = `
                <div class="p-6 sm:p-10 text-center fade-in">
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Результаты тестирования</h2>
                    <p class="text-xs text-slate-400 mb-6">Стандарт АПКР-6 Часть-IV & Воздушное Право КР (2026)</p>

                    <div class="w-36 h-36 rounded-full border-4 ${percentage >= 85 ? 'border-emerald-500' : percentage >= 65 ? 'border-amber-500' : 'border-rose-500'} flex flex-col items-center justify-center mx-auto mb-6 bg-slate-900 shadow-xl">
                        <span class="text-4xl font-black text-white">${percentage}%</span>
                        <span class="text-xs text-slate-400 mt-0.5">${state.score} из ${total} правильных</span>
                    </div>

                    <div class="inline-block px-4 py-2 rounded-2xl border ${badgeColor} text-sm font-semibold mb-8">
                        ${badgeText}
                    </div>

                    <div class="grid grid-cols-2 gap-3 max-w-sm mx-auto mb-8 text-left">
                        <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-center">
                            <div class="text-xl font-bold text-emerald-400">${state.score}</div>
                            <div class="text-[11px] text-slate-400">Правильно</div>
                        </div>
                        <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-center">
                            <div class="text-xl font-bold text-rose-400">${total - state.score}</div>
                            <div class="text-[11px] text-slate-400">Ошибок</div>
                        </div>
                    </div>

                    <div class="space-y-3 max-w-md mx-auto">
                        <button onclick="startExam()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold rounded-2xl shadow-lg shadow-blue-600/30 transition-all active:scale-95 text-base cursor-pointer">
                            🔄 Пройти ещё раз
                        </button>
                        <button onclick="renderStartScreen()" class="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-2xl transition-all text-sm cursor-pointer">
                            ⚙️ Вернуться в меню выбора модулей
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize Application
        window.onload = renderStartScreen;
    </script>
</body>
</html>
