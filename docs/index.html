    const m=metrics(),resume=state.activeSession?`<div class="resume"><p><strong>Незавершённая сессия:</strong> ${esc(state.activeSession.title)} · вопрос ${Math.min(state.activeSession.index+1,state.activeSession.queue.length)} из ${state.activeSession.queue.length}</p><div><button class="btn small primary" data-action="resume">Продолжить</button> <button class="btn small ghost" data-action="discard">Сбросить сессию</button></div></div>`:"";
    const notice=bootNotice?`<div class="callout" style="margin-bottom:18px"><strong>Хранилище:</strong> ${esc(bootNotice)}</div>`:"";
    const status=m.readiness>=85?"Внутренний ориентир достигнут":"Цель — 85%";
    return `<section class="screen">${notice}${resume}<div class="hero"><div class="hero-copy"><div class="eyebrow">Автономный учебный тренажёр</div><h1 class="title">Подготовьтесь к работе с БПЛА без лишнего шума</h1><p class="lead">${QUESTIONS.length} вопросов по АПКР‑6, безопасности, метеорологии, устройству и DJI Fly. С объяснением каждого ответа и точной ссылкой на источник.</p><div class="hero-actions"><button class="btn primary" data-start="diagnostic">Начать диагностику</button><button class="btn ghost" data-nav="routes">Выбрать маршрут</button></div></div><aside class="readiness-card"><div><div class="eyebrow">Индекс готовности</div><div class="ring" style="--value:${m.readiness}"><div class="ring-value"><strong>${m.readiness}%</strong><span>${status}</span></div></div><div class="progress-line"><i style="width:${m.coverage}%"></i></div><p class="muted" style="font-size:13px;margin:0">Охват банка: ${m.coverage}% · точность: ${m.accuracy}%</p></div><div class="ready-note"><strong>85% — внутренний ориентир тренажёра, не официальный проходной балл.</strong> Индекс на 75% состоит из точности и на 25% из охвата банка.</div></aside></div>
      <div class="stats-grid"><div class="stat-card"><b>${m.attempted}/${QUESTIONS.length}</b><span>вопросов изучено</span></div><div class="stat-card"><b>${m.accuracy}%</b><span>точность ответов</span></div><div class="stat-card"><b>${m.mistakes}</b><span>в работе над ошибками</span></div><div class="stat-card"><b>${m.bestStreak}</b><span>лучшая серия</span></div></div>
      <div class="section-head"><div><div class="eyebrow">Режимы</div><h2 class="subhead">Выберите темп подготовки</h2></div><p>В тренировках ответ разбирается сразу. На пробном экзамене правильные ответы скрыты до завершения.</p></div>
      <div class="mode-grid"><article class="card mode-card featured"><span class="num">01 · СТАРТ</span><h3>Диагностика</h3><p>25 сбалансированных вопросов покажут сильные и слабые темы.</p><button class="btn primary" data-start="diagnostic">25 вопросов</button></article><article class="card mode-card"><span class="num">02 · ВЫСОКИЙ ПРИОРИТЕТ</span><h3>Турбо‑интенсив</h3><p>Все 60 вопросов приоритета A — наиболее вероятное ядро проверки.</p><button class="btn" data-start="turbo">60 вопросов</button></article><article class="card mode-card"><span class="num">03 · КОНТРОЛЬ</span><h3>Пробный экзамен</h3><p>40 вопросов, 45 минут. Результат и разбор — только после финиша.</p><button class="btn orange" data-start="exam">Запустить таймер</button></article><article class="card mode-card"><span class="num">04 · ЗАКРЕПЛЕНИЕ</span><h3>Работа над ошибками</h3><p>${m.mistakes?`Сейчас в списке ${m.mistakes} вопросов.`:"Появится после первого неверного ответа."} Ошибка возвращается после восьми других вопросов.</p><button class="btn" data-start="mistakes">Повторить ошибки</button></article></div>

      <div class="callout" style="margin-top:38px"><strong>Ловушка:</strong> приложение DJI Fly помогает увидеть геозоны, но не заменяет официальные разрешения, AIP и требования АПКР‑6.</div><p class="footer-note">Работает полностью офлайн · прогресс хранится только в этом браузере</p></section>`;
  }
  function topicCard(key,icon,title,count,desc){return `<article class="card topic-card"><span class="topic-icon">${icon}</span><h3>${title}</h3><p>${desc}</p><button class="btn small" data-start="topic" data-arg="${key}">${count} вопросов</button></article>`}
  function formatTime(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
  function examSeconds(){return session&&session.endAt?Math.max(0,Math.ceil((session.endAt-Date.now())/1000)):0}
  function startTimer(){
    if(!session||!session.exam)return;const tick=()=>{const el=document.getElementById("timer");const seconds=examSeconds();if(el)el.textContent=formatTime(seconds);if(seconds<=0){clearInterval(timerHandle);timerHandle=null;finishSession();return}if(seconds%10===0){state.activeSession=session;save()}};tick();timerHandle=setInterval(tick,1000);
  }
  function renderQuiz(){
    if(!session){currentView="home";render();return}const item=session.queue[session.index],question=QMAP.get(item.qid),answered=item.answer!==null,progress=Math.round((session.index+1)/session.queue.length*100),letters=["A","B","C","D"];
    const optionHTML=item.order.map((original,pos)=>{let cls="option";if(answered){if(session.exam){if(original===item.answer)cls+=" selected"}else{if(original===question.answer)cls+=" correct";else if(original===item.answer)cls+=" wrong"}}return `<button class="${cls}" data-answer="${original}" ${answered?"disabled":""}><span class="option-letter">${letters[pos]}</span><span>${esc(question.options[original])}</span></button>`}).join("");
    let feedback="";if(answered&&!session.exam){const ok=item.answer===question.answer;feedback=`<div class="feedback ${ok?"":"bad"}"><h3>${ok?"Верно":"Неверно · правильный ответ: "+esc(question.options[question.answer])}</h3><p>${esc(question.explain)}</p><p class="source">Источник: ${esc(question.source)}</p></div>`}
    const nextLabel=session.index===session.queue.length-1?"Завершить":"Следующий вопрос";
    document.getElementById("app").innerHTML=`<section class="screen quiz-shell"><div class="quiz-top"><button class="back-btn" data-action="pause" aria-label="Сохранить и выйти">←</button><div class="quiz-meta"><h1>${esc(session.title)}</h1><p>${session.exam?"Экзамен":"Тренировка"} · ${session.index+1} из ${session.queue.length}${session.queue.length>session.originalTotal?` · плановых ${session.originalTotal}`:""}</p></div>${session.exam?`<div class="timer" id="timer">${formatTime(examSeconds())}</div>`:""}</div><div class="quiz-progress"><i style="width:${progress}%"></i></div><article class="question-card"><div class="q-tags"><span class="tag">${esc(question.section)}</span><span class="tag priority">Приоритет ${question.priority}</span>${item.isRepeat?'<span class="tag repeat">Повтор ошибки</span>':""}${item.isFiller?'<span class="tag">Интервал повтора</span>':""}</div><h2>${esc(question.text)}</h2><div class="options">${optionHTML}</div>${session.exam&&answered?'<div class="exam-lock">Ответ принят. Правильность будет показана после завершения экзамена.</div>':""}${feedback}<div class="quiz-actions"><button class="btn ghost" data-action="skip" ${answered?"disabled":""}>Пропустить</button>${answered?`<button class="btn primary" data-action="next">${nextLabel}</button>`:""}</div></article></section>`;
    document.getElementById("app").focus({preventScroll:true});if(session.exam)startTimer();
  }
  function renderResult(){
    if(!lastResult)return `<section class="screen panel empty"><h2>Результат уже сохранён</h2><p>Вернитесь на главную, чтобы начать новый тест.</p><button class="btn primary" data-nav="home">На главную</button></section>`;
    const r=lastResult,passed=r.score>=85,errors=r.items.filter(item=>item.answer===null||item.answer!==QMAP.get(item.qid).answer);
    const review=errors.length?errors.map(item=>{const question=QMAP.get(item.qid),ok=item.answer===question.answer;return `<details class="review-item ${ok?"ok":""}"><summary><span class="mark">${ok?"✓":"×"}</span><span>${esc(question.text)}</span></summary><div class="review-body"><p><strong>Ваш ответ:</strong> ${item.answer===null?"нет ответа":esc(question.options[item.answer])}</p><p><strong>Правильно:</strong> ${esc(question.options[question.answer])}</p><p>${esc(question.explain)}</p><span class="source">Источник: ${esc(question.source)}</span></div></details>`}).join(""):`<div class="callout"><strong>Чистая работа:</strong> все отвеченные вопросы решены верно.</div>`;
    return `<section class="screen"><div class="panel result-hero"><div class="eyebrow">${r.exam?"Пробный экзамен завершён":"Тренировка завершена"}</div><div class="result-score">${r.score}%</div><h1>${passed?"Ориентир готовности достигнут":"Есть что укрепить"}</h1><p class="muted">${esc(r.title)} · внутренний ориентир 85% не является официальным проходным баллом.</p><div class="result-grid"><div class="stat-card"><b>${r.correct}</b><span>правильно</span></div><div class="stat-card"><b>${r.wrong}</b><span>ошибок</span></div><div class="stat-card"><b>${r.unanswered}</b><span>без ответа</span></div></div><div class="hero-actions" style="justify-content:center"><button class="btn primary" data-action="repeat-last">Повторить режим</button><button class="btn ghost" data-nav="home">На главную</button></div></div><div class="section-head"><div><div class="eyebrow">Разбор</div><h2 class="subhead">Ошибки и пропуски</h2></div><p>Откройте карточку, чтобы увидеть правильный ответ, пояснение и источник.</p></div><div class="review-list">${review}</div></section>`;
  }
  function renderRoutes(){
    const cards=[1,2,3].map(day=>{const route=ROUTES[day],checks=state.routeChecks[day]||[],done=checks.filter(Boolean).length,active=state.activeRoute===day;return `<article class="card route-card ${active?"active":""}"><div class="eyebrow">Маршрут</div><h2>${route.label}</h2><p>${route.subtitle}</p><div class="progress-line"><i style="width:${pct(done,route.tasks.length)}%"></i></div><small class="muted">${done} из ${route.tasks.length} этапов отмечено</small><div class="route-list">${route.tasks.map((task,index)=>`<label class="route-task"><input type="checkbox" data-route-check="${day}" data-index="${index}" ${checks[index]?"checked":""}><span>${esc(task[0])}<small>${esc(task[1])}</small></span></label>`).join("")}</div><button class="btn ${active?"primary":""}" data-route="${day}">${active?"Маршрут выбран":"Выбрать маршрут"}</button></article>`}).join("");

  function renderMemos(){

  function memoContent(index){
    if(index===0)return `<div class="eyebrow">Памятка 1</div><h2>Классы БПЛА</h2><p>Класс определяется по максимальной взлётной массе с полезной нагрузкой. Упрощённая таблица ниже повторяет формальный текст АПКР‑6.</p><div class="table-wrap"><table><thead><tr><th>Класс</th><th>Масса</th><th>Лётная годность</th><th>Документ пилота</th></tr></thead><tbody><tr><td><strong>C0</strong></td><td>151–250 г</td><td>Не требуется</td><td>Сертификат оператора</td></tr><tr><td><strong>C1</strong></td><td>251–900 г</td><td>Не требуется</td><td>Сертификат оператора</td></tr><tr><td><strong>C2</strong></td><td>901–4 000 г</td><td>Не требуется</td><td>Сертификат оператора</td></tr><tr><td><strong>C3</strong></td><td>4 001–25 000 г</td><td>Акт технического состояния</td><td>Свидетельство внешнего пилота</td></tr><tr><td><strong>C4</strong></td><td>Свыше 25 001 г — формулировка источника</td><td>Сертификат лётной годности</td><td>Свидетельство внешнего пилота</td></tr></tbody></table></div><div class="callout"><strong>До 150 г:</strong> без камеры — не регистрируется; с фото/видеофиксацией — учёт, регистрация и C0*. Изменение массы более чем на 10% после модернизации требует повторного определения класса.</div><div class="trap"><b>Граница C3/C4.</b> В таблице источника C3 заканчивается на 25 000 г, а C4 записан как «более 25 001 г», поэтому ровно 25 001 г формально не покрыт. Эта неоднозначная точка не оценивается в вопросах.</div><p class="source">Источник: АПКР-6 Ч.4 (русский) (1).pdf — стр. 11–12, пп. 11–19.</p>`;
    if(index===1)return `<div class="eyebrow">Памятка 2</div><h2>Зоны и дистанции</h2><div class="table-wrap"><table><thead><tr><th>Зона</th><th>Сценарий</th><th>Высота</th><th>Что требуется</th></tr></thead><tbody><tr><td><strong>D · зелёная</strong></td><td>Вне населённых пунктов, вдали от людей</td><td>До 120 м AGL</td><td>Без разрешения и уведомления</td></tr><tr><td><strong>C · жёлтая</strong></td><td>Населённые пункты / отдельные люди; либо вне города выше 120 м</td><td>До 120 м или 120–500 м AGL</td><td>Уведомление ВС ГЦ ОВД КР</td></tr><tr><td><strong>B · оранжевая</strong></td><td>Ключевая инфраструктура, ограничения</td><td>Индивидуально</td><td>Разрешение ОГА + запрос + план</td></tr><tr><td><strong>A · красная</strong></td><td>Контролируемое пространство, скопления людей, IFR, автономные операции</td><td>Индивидуально</td><td>Разрешение ОГА + запрос + план</td></tr><tr><td><strong>F · сегрегированная</strong></td><td>Специально выделенный район</td><td>По решению</td><td>Решение ОГА/ОВД, SORA, разрешение</td></tr></tbody></table></div><h3>Держите в памяти</h3><ul><li>C0–C1 при низком риске: не менее <strong>50 м</strong>.</li><li>C3: не менее <strong>100 м</strong>.</li><li>BVLOS и повышенный риск: <strong>150 м</strong>, если иное не утверждено по SORA.</li><li>Без согласования: не ближе <strong>7 км</strong> к КТА аэродрома.</li></ul><div class="trap"><b>Ловушка формулировок.</b> Пункт 35 одновременно включает C2 в диапазоны «C0–C2 — 50 м» и «C2–C4 — 100 м». В оцениваемых вопросах C2 намеренно не используется для выбора между этими числами; до официального разъяснения безопаснее применять более строгий предел.</div><p class="source">Источник: АПКР-6 Ч.4 (русский) (1).pdf — стр. 14–16, пп. 33–36.</p>`;
    if(index===2)return `<div class="eyebrow">Памятка 3</div><h2>Нормативные числа</h2><div class="table-wrap"><table><thead><tr><th>Число</th><th>Что означает</th><th>Источник</th></tr></thead><tbody><tr><td><strong>18 лет</strong></td><td>Минимальный возраст кандидата</td><td>стр. 13, п. 28</td></tr><tr><td><strong>36 месяцев</strong></td><td>Срок сертификата оператора</td><td>стр. 14, п. 30</td></tr><tr><td><strong>120 м AGL</strong></td><td>Верх зоны D и городской сценарий зоны C</td><td>стр. 14–15, п. 33</td></tr><tr><td><strong>7 км</strong></td><td>Запрет от КТА без согласования</td><td>стр. 16, п. 36</td></tr><tr><td><strong>5 рабочих дней</strong></td><td>Согласование особо охраняемого объекта</td><td>стр. 17, п. 48</td></tr><tr><td><strong>12 месяцев</strong></td><td>Возможный срок разрешения юрлицу</td><td>стр. 18, п. 54</td></tr><tr><td><strong>3 дня</strong></td><td>Предоставление разрешения после проверки</td><td>стр. 18, п. 56</td></tr><tr><td><strong>2 часа</strong></td><td>Минимальный срок уведомления о полёте</td><td>стр. 19, п. 58</td></tr><tr><td><strong>21 рабочий день</strong></td><td>Рассмотрение заявления на сертификат эксплуатанта</td><td>стр. 25, п. 87</td></tr></tbody></table></div><h3>Ловушки формулировок</h3><div class="trap"><b>Высота RTH 40–60, 50–70 или 80–120 м</b> из учебных материалов — не универсальная норма АПКР‑6. Оценивается принцип: выше наивысшего препятствия с учётом законного лимита зоны.</div><div class="trap"><b>7 или 9 спутников</b> — учебные рекомендации, зависящие от модели и условий, а не нормативное число АПКР‑6. Оценивается подтверждение устойчивой навигации и записи Home Point.</div><div class="trap"><b>«Максимум 500 м»</b> из старого конспекта не используется как разрешённая высота: применяются категории зоны, разрешение и ограничения операции.</div><p class="source">Приоритетный источник чисел: АПКР-6 Ч.4 (русский) (1).pdf.</p>`;
    if(index===3)return `<div class="eyebrow">Памятка 4</div><h2>Предполётная проверка</h2><ol class="steps"><li><div><strong>Право и пространство.</strong><br><span class="muted">Регистрация, допуск, зона, разрешение/уведомление, страховка при обязательности.</span></div></li><li><div><strong>Метеоусловия.</strong><br><span class="muted">Ветер у земли и на высоте, осадки, гроза, видимость, запас на возврат.</span></div></li><li><div><strong>Корпус и силовая установка.</strong><br><span class="muted">Трещины, лучи, крепёж, правильные и целые пропеллеры, свободное вращение.</span></div></li><li><div><strong>Питание.</strong><br><span class="muted">Заряд, температура, отсутствие вздутия и повреждений, фиксация батареи.</span></div></li><li><div><strong>Связь и датчики.</strong><br><span class="muted">Пульт, телеметрия, навигация, IMU/компас без ошибок.</span></div></li><li><div><strong>Home Point и RTH.</strong><br><span class="muted">Точка записана верно, высота возврата выше препятствий.</span></div></li><li><div><strong>Площадка.</strong><br><span class="muted">Люди, дороги, ЛЭП, деревья, здания; безопасные направления взлёта и аварийной посадки.</span></div></li><li><div><strong>Камера и полезная нагрузка.</strong><br><span class="muted">Колпачок снят, подвес свободен, нагрузка закреплена и учтена в массе.</span></div></li></ol><p class="source">Источники: АПКР-6 Ч.4 (русский) (1).pdf — стр. 21, п. 65; Лекционные_материалы_правила_безопасности.docx — раздел 1.</p>`;
    if(index===4)return `<div class="eyebrow">Памятка 5</div><h2>Аварийные процедуры</h2><div class="table-wrap"><table><thead><tr><th>Событие</th><th>Действие</th></tr></thead><tbody><tr><td><strong>Потеря радиосвязи</strong></td><td>Не паниковать; проверить пульт и телеметрию; контролировать ожидаемый RTH; восстановив связь, оценить безопасное продолжение.</td></tr><tr><td><strong>Критический заряд</strong></td><td>Прекратить миссию и направить аппарат к ближайшей безопасной посадке. Не пытаться «доснять».</td></tr><tr><td><strong>Потеря GPS / ATTI</strong></td><td>Ожидать дрейф по ветру; перейти к плавному визуальному ручному управлению и посадить.</td></tr><tr><td><strong>Flyaway</strong></td><td>Сохранять спокойствие, проверить режим и телеметрию, попытаться восстановить управление/RTH, использовать карту.</td></tr><tr><td><strong>Отказ двигателя</strong></td><td>Увести возможную точку падения от людей и имущества; экстренно посадить; обесточить; провести полный техосмотр.</td></tr><tr><td><strong>Угроза людям</strong></td><td>Немедленно прекратить полёт и обеспечить посадку — задача всегда вторична относительно безопасности.</td></tr></tbody></table></div><div class="callout"><strong>После жёсткой посадки:</strong> выключите аппарат и контроллер, безопасно извлеките аккумулятор, осмотрите батарею и конструкцию. Не запускайте повторно без проверки.</div><p class="source">Источники: Professional_UAV_Operations.pptx — слайды 12–13; Лекционные_материалы_правила_безопасности.docx — разделы 3–5; АПКР‑6 — стр. 22, п. 71.</p>`;
    return `<div class="eyebrow">Памятка 6</div><h2>Метео Go/No-Go</h2><p>Погода оценивается не одной иконкой приложения, а последовательным сопоставлением прогноза, фактических условий, маршрута и ограничений конкретного БПЛА.</p><ol class="steps"><li><div><strong>Ограничения аппарата.</strong><br><span class="muted">Сверьте руководство изготовителя: допустимый ветер и порывы, температура, осадки, степень защиты, ограничения батареи.</span></div></li><li><div><strong>Прогноз и предупреждения.</strong><br><span class="muted">Проверьте TAF/модели и сообщения об опасных явлениях; оцените изменение условий на всё время миссии.</span></div></li><li><div><strong>Фактическая погода.</strong><br><span class="muted">METAR ближайшего аэродрома дополните локальным измерением на площадке — особенно ветер и порывы.</span></div></li><li><div><strong>Маршрут и микроклимат.</strong><br><span class="muted">Учтите рельеф, ветровую тень, вихри у зданий, переходы indoor/outdoor и ветер на рабочей высоте.</span></div></li><li><div><strong>Опасные явления.</strong><br><span class="muted">Облачность и видимость, дождь/снег/град, гроза, турбулентность, обледенение, туман, пыль и запотевание датчиков.</span></div></li><li><div><strong>Решение и запас.</strong><br><span class="muted">Зафиксируйте Go/No-Go, безопасные площадки и энергетический резерв; при сомнении переносите полёт.</span></div></li></ol><div class="table-wrap"><table><thead><tr><th>Источник</th><th>Назначение</th></tr></thead><tbody><tr><td><strong>METAR</strong></td><td>Текущие наблюдения на аэродроме</td></tr><tr><td><strong>TAF</strong></td><td>Прогноз аэродромной погоды и ожидаемых изменений</td></tr><tr><td><strong>SIGMET / AIRMET</strong></td><td>Предупреждения об опасных авиационных явлениях</td></tr><tr><td><strong>Модели и приложения</strong></td><td>Пространственный прогноз; требуют сверки с наблюдениями</td></tr><tr><td><strong>Локальная станция</strong></td><td>Фактические гиперлокальные условия в зоне операции</td></tr></tbody></table></div><div class="trap"><b>Ловушка чисел.</b> Приведённые в слайдах пределы ветра, видимости, температуры и расстояния до грозы обозначены как примерные рекомендации. Они не являются универсальным метеоминимумом АПКР‑6 и не используются в оцениваемых вопросах. Применяйте более строгие из требований правил, разрешения, руководства изготовителя и оценки риска.</div><p class="source">Источники: Тема 1. .pptx — слайды 5–8; Тема 2.pptx — слайды 2–13; Тема 3.pptx — слайды 1–12; Тема 4.pptx — слайды 1–8.</p>`;
  }
  let SELF_TESTS={ok:false,tests:[],errors:["Проверки ещё не выполнены"]};
  function renderSettings(){
    const m=metrics(),audit=BANK_AUDIT,tests=SELF_TESTS,history=state.history.length?state.history.slice(0,8).map(h=>`<tr><td>${esc(h.title)}</td><td>${h.score}%</td><td>${new Date(h.at).toLocaleDateString("ru-RU")}</td></tr>`).join(""):`<tr><td colspan="3" class="muted">Завершённых сессий пока нет</td></tr>`;
    return `<section class="screen"><div class="eyebrow">Данные и контроль</div><h1 class="title" style="max-width:850px">Ваш прогресс принадлежит вам</h1><p class="lead">Адрес временного хостинга может измениться. Экспортируйте JSON, чтобы перенести результаты в другой браузер или на новый адрес.</p><div class="settings-grid" style="margin-top:30px"><article class="card settings-card"><h2>Перенос прогресса</h2><p>Файл содержит только статистику тренажёра, маршрут и незавершённую сессию. Личных данных и материалов источников в нём нет.</p><div class="hero-actions"><button class="btn primary" data-action="export">Экспорт JSON</button><label class="btn file-label">Импорт JSON<input id="import-file" type="file" accept="application/json,.json"></label></div><p class="source">Схема сохранения: v${SCHEMA_VERSION} · localStorage: ${HAS_STORAGE?"доступен":"недоступен"}</p></article><article class="card settings-card"><h2>Сброс</h2><p>Удаляет статистику, историю, маршрут и незавершённый тест только для этого тренажёра. Сам файл HTML не изменяется.</p><button class="btn danger" data-action="reset">Сбросить весь прогресс</button></article></div>
      <div class="section-head"><div><div class="eyebrow">Самопроверка</div><h2 class="subhead">Целостность банка</h2></div><p>${audit.ok&&tests.ok?"Все встроенные проверки пройдены.":"Обнаружена ошибка — сведения ниже."}</p></div><div class="card"><div class="audit-list">${Object.keys(EXPECTED).map(k=>`<div class="audit-chip"><b>${audit.counts[k]}</b><span>${THEME_NAMES[k]}</span></div>`).join("")}<div class="audit-chip"><b>${audit.priorities.A}</b><span>приоритет A</span></div><div class="audit-chip"><b>${audit.total}</b><span>всего</span></div><div class="audit-chip"><b>${audit.ok&&tests.ok?"OK":"ERR"}</b><span>${tests.tests.length} проверок</span></div></div>${audit.errors.length||tests.errors.length?`<div class="callout" style="margin-top:16px"><strong>Ошибки:</strong> ${esc(audit.errors.concat(tests.errors).join("; "))}</div>`:`<p class="muted">Проверены уникальность ID и текста, четыре варианта, индекс ответа, объяснение, ссылка на источник, распределение ${Object.values(EXPECTED).join("/")}, 60 вопросов A, выборки режимов, перемешивание, повтор через восемь вопросов, таймер и схема сохранения.</p>`}</div>
      <div class="section-head"><div><div class="eyebrow">Статистика</div><h2 class="subhead">Последние результаты</h2></div><p>Индекс готовности сейчас ${m.readiness}%: точность ${m.accuracy}%, охват ${m.coverage}%.</p></div><div class="table-wrap"><table><thead><tr><th>Режим</th><th>Результат</th><th>Дата</th></tr></thead><tbody>${history}</tbody></table></div><div class="callout"><strong>Важно:</strong> тренажёр помогает готовиться по предоставленным материалам, но не заменяет официальную публикацию правил, указания ОГА/ОВД и актуальные разрешения.</div></section>`;
  }
  function showToast(message){const el=document.getElementById("toast");if(!el)return;el.textContent=message;el.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove("show"),2600)}
  function exportProgress(){
    const payload={app:"Пульт допуска БПЛА",version:SCHEMA_VERSION,exportedAt:nowISO(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`uav-progress-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast("Прогресс экспортирован")
  }
  async function importProgress(file){
    try{const data=JSON.parse(await file.text()),incoming=data&&data.state?data.state:data,clean=normalizeState(incoming);if(!clean)throw new Error(`Нужен файл схемы v${SCHEMA_VERSION}`);state=clean;session=null;lastResult=null;save();currentView="home";render();showToast("Прогресс импортирован")}catch(error){showToast("Импорт не выполнен: "+error.message)}
  }
  function resetProgress(){if(!confirm("Сбросить всю статистику и незавершённые тесты? Это действие нельзя отменить без экспортированного JSON."))return;clearInterval(timerHandle);if(HAS_STORAGE)localStorage.removeItem(STORAGE_KEY);state=defaultState();session=null;lastResult=null;bootNotice="";currentView="home";render();showToast("Прогресс сброшен")}
  function discardSession(){if(!confirm("Удалить только незавершённую сессию? Уже сохранённая статистика останется."))return;state.activeSession=null;session=null;save();render();showToast("Сессия удалена")}

  document.addEventListener("click",event=>{
    const answer=event.target.closest("[data-answer]");if(answer){answerCurrent(Number(answer.dataset.answer));return}
    const action=event.target.closest("[data-action]");if(action){
      const name=action.dataset.action;
      if(name==="resume")resumeSession();else if(name==="discard")discardSession();else if(name==="pause")pauseSession();else if(name==="skip")skipCurrent();else if(name==="next")advanceSession();else if(name==="export")exportProgress();else if(name==="reset")resetProgress();else if(name==="repeat-last"&&lastResult)startSession(lastResult.kind,lastResult.arg);return;
    }
    const starter=event.target.closest("[data-start]");if(starter){if(state.activeSession&&!session&&!confirm("Начать новую тренировку и заменить незавершённую сессию?"))return;startSession(starter.dataset.start,starter.dataset.arg||"");return}
    const memo=event.target.closest("[data-memo]");if(memo){memoIndex=Number(memo.dataset.memo);render();return}
    const route=event.target.closest("[data-route]");if(route){state.activeRoute=Number(route.dataset.route);save();render();showToast(`Выбран маршрут на ${state.activeRoute} ${state.activeRoute===1?"день":"дня"}`);return}
    const nav=event.target.closest("[data-nav]");if(nav){if(session){state.activeSession=session;save()}clearInterval(timerHandle);timerHandle=null;currentView=nav.dataset.nav;render()}
  });
  document.addEventListener("change",event=>{
    if(event.target.id==="import-file"&&event.target.files[0]){importProgress(event.target.files[0]);event.target.value="";return}
    if(event.target.matches("[data-route-check]")){const day=Number(event.target.dataset.routeCheck),index=Number(event.target.dataset.index);state.routeChecks[day][index]=event.target.checked;save();render()}
  });
  document.addEventListener("keydown",event=>{if(currentView!=="quiz"||!session)return;if(["1","2","3","4"].includes(event.key)){const item=session.queue[session.index];if(item.answer===null){const displayed=Number(event.key)-1;answerCurrent(item.order[displayed])}}else if(event.key==="Enter"&&session.queue[session.index].answer!==null)advanceSession()});
  window.addEventListener("beforeunload",()=>{if(session){state.activeSession=session;save()}});

  function runSelfTests(){
    const tests=[],errors=[];const test=(name,fn)=>{try{if(!fn())throw new Error("условие ложно");tests.push(name)}catch(error){errors.push(`${name}: ${error.message}`)}};
    test("банк",()=>BANK_AUDIT.ok);
    test("диагностика 25",()=>selection("diagnostic").length===25);
    test("турбо 60 A",()=>{const ids=selection("turbo");return ids.length===60&&ids.every(id=>QMAP.get(id).priority==="A")});
    test("экзамен 40",()=>selection("exam").length===40);
    test("темы",()=>selection("topic","law").length===45&&selection("topic","safety").length===30&&selection("topic","meteo").length===30&&selection("topic","device").length===19&&selection("topic","dji").length===14&&selection("topic","aero").length===6);
    test("перемешивание вариантов",()=>{const order=shuffleWith([0,1,2,3],()=>0);return new Set(order).size===4&&order.join("")!=="0123"});
    test("повтор через восемь",()=>{const queue=[makeItem("LAW-001"),makeItem("LAW-002")],target=scheduleRepeat(queue,0,"LAW-001",["LAW-001","LAW-002","LAW-003"]);return target===9&&queue[9].qid==="LAW-001"&&queue[9].isRepeat&&queue.slice(1,9).every(x=>x.qid!=="LAW-001")});
    test("таймер 45 минут",()=>formatTime(45*60)==="45:00"&&formatTime(0)==="00:00");
    test("схема сохранения",()=>!!normalizeState(JSON.parse(JSON.stringify(defaultState()))));
    test("индексы ответов",()=>QUESTIONS.every(x=>x.options[x.answer]!==undefined));
    test("без внешних ресурсов",()=>![...document.querySelectorAll("[src],[href]")].some(el=>/^(https?:)?\/\//i.test(el.getAttribute("src")||el.getAttribute("href")||"")));
    return {ok:errors.length===0,tests,errors};
  }
  SELF_TESTS=runSelfTests();
  window.__UAV_TRAINER__=Object.freeze({version:SCHEMA_VERSION,questions:QUESTIONS,audit:BANK_AUDIT,selfTests:SELF_TESTS,selection,shuffleWith,normalizeState,formatTime});
  if(!BANK_AUDIT.ok||!SELF_TESTS.ok)console.error("UAV trainer self-test failed",BANK_AUDIT.errors,SELF_TESTS.errors);
  render();if(bootNotice)setTimeout(()=>showToast(bootNotice),350);
  </script>
